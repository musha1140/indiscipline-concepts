<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Switchboard</title>
<meta name="description" content="Gas-Lighting LLC client messaging console: channels per client, intake screening, sealed threads, watermarked messages, and signed engagement flows.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111110;--panel:#1a1a18;--panel2:#22221f;--hover:#2a2a26;--text:#f1ede3;--muted:#b5b1a8;--faint:#7d7a73;
  --line:#383834;--accent:#f34b42;--accent-ink:#111110;--ok:#6fbf73;--warn:#e0a84a;--info:#7fb0d8;
  --radius:10px;--shadow:0 18px 48px rgba(0,0,0,.45);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f6f3ec;--panel:#ffffff;--panel2:#efebe2;--hover:#e7e2d6;--text:#1b1a17;--muted:#5d5a53;--faint:#8a867d;
    --line:#d8d3c8;--accent:#c8322a;--accent-ink:#ffffff;--ok:#2f7d34;--warn:#a26b12;--info:#2f6690;
    --shadow:0 18px 48px rgba(40,30,10,.18);color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f6f3ec;--panel:#ffffff;--panel2:#efebe2;--hover:#e7e2d6;--text:#1b1a17;--muted:#5d5a53;--faint:#8a867d;
  --line:#d8d3c8;--accent:#c8322a;--accent-ink:#ffffff;--ok:#2f7d34;--warn:#a26b12;--info:#2f6690;
  --shadow:0 18px 48px rgba(40,30,10,.18);color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#111110;--panel:#1a1a18;--panel2:#22221f;--hover:#2a2a26;--text:#f1ede3;--muted:#b5b1a8;--faint:#7d7a73;
  --line:#383834;--accent:#f34b42;--accent-ink:#111110;--ok:#6fbf73;--warn:#e0a84a;--info:#7fb0d8;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "DM Sans",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.display{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;letter-spacing:-.01em}

.app{display:grid;grid-template-columns:268px minmax(0,1fr);height:100dvh}
.app.thread-open{grid-template-columns:268px minmax(0,1fr) 360px}

/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:26px;line-height:1;font-weight:800}
.brand h1 span{color:var(--accent)}
.brand small{display:block;font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.3px}
.side-scroll{overflow:auto;flex:1;padding:10px 8px 16px}
.nav-label{display:flex;align-items:center;justify-content:space-between;font:600 11px/1 "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:1.2px;color:var(--faint);padding:14px 10px 6px}
.nav-label button{background:none;border:0;color:var(--muted);font-size:16px;line-height:1;padding:2px 6px;border-radius:6px}
.nav-label button:hover{background:var(--hover);color:var(--text)}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 10px;color:var(--muted)}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.nav-item .glyph{width:16px;text-align:center;color:var(--faint);flex:none}
.nav-item .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item.unread{color:var(--text);font-weight:600}
.badge{background:var(--accent);color:var(--accent-ink);font:700 11px/1 "DM Sans",sans-serif;border-radius:999px;padding:3px 7px;min-width:20px;text-align:center}
.badge.soft{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.org-head{display:flex;align-items:center;gap:8px;padding:10px 10px 4px;color:var(--text);font-weight:600;font-size:13px}
.org-dot{width:9px;height:9px;border-radius:3px;background:var(--accent);flex:none}
.org-head .grow{flex:1}
.org-head button{background:none;border:0;color:var(--faint);padding:2px 6px;border-radius:6px;font-size:12px}
.org-head button:hover{background:var(--hover);color:var(--text)}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.persona{display:flex;align-items:center;gap:8px}
.avatar{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:700 12px/1 "DM Sans",sans-serif;color:#fff;flex:none}
.persona select{flex:1;min-width:0;width:100%;text-overflow:ellipsis;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.foot-row{display:flex;gap:6px;flex-wrap:wrap}
.chip-btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--muted)}
.chip-btn:hover{color:var(--text);border-color:var(--faint)}
.sync-line{font-size:11px;color:var(--faint);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.err{background:var(--accent)}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);min-height:62px}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.title{flex:1;min-width:0}
.title h2{margin:0;font-size:24px;line-height:1.05;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title p{margin:2px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 10px;width:min(320px,38vw)}
.search input{background:none;border:0;outline:none;padding:8px 0;width:100%}
.search kbd{white-space:nowrap;font:11px "JetBrains Mono",monospace;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.content{flex:1;overflow:auto;min-height:0}
.pad{padding:18px clamp(14px,3vw,28px) 28px}

/* messages */
.msgs{padding:10px 0 18px}
.day{display:flex;align-items:center;gap:12px;color:var(--faint);font:600 11px/1 "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:1px;padding:16px 22px 6px}
.day::before,.day::after{content:"";height:1px;background:var(--line);flex:1}
.msg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:8px 22px;position:relative}
.msg:hover{background:var(--panel)}
.msg .avatar{width:36px;height:36px;border-radius:10px;font-size:13px}
.msg-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.msg-head b{font-weight:700}
.msg-head .org{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 7px}
.msg-head time{font-size:12px;color:var(--faint)}
.msg-body{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;margin-top:1px}
.msg-body.locked{color:var(--faint);font-style:italic}
.msg-meta{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}
.tag{font:600 10.5px/1 "JetBrains Mono",monospace;letter-spacing:.5px;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:4px 6px;color:var(--muted);background:none}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.tag.bad{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.tag.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 45%,var(--line))}
button.tag:hover{color:var(--text)}
.link-btn{background:none;border:0;padding:0;color:var(--info);font-size:13px;font-weight:600}
.link-btn:hover{text-decoration:underline}
.msg-actions{position:absolute;right:18px;top:-12px;display:none;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px;box-shadow:var(--shadow)}
.msg:hover .msg-actions,.msg:focus-within .msg-actions{display:flex}
.msg-actions button{background:none;border:0;border-radius:6px;padding:4px 8px;font-size:12px;color:var(--muted)}
.msg-actions button:hover{background:var(--hover);color:var(--text)}
.empty{color:var(--muted);text-align:center;padding:60px 20px}
.empty h3{font-size:30px;margin:0 0 6px;color:var(--text)}

/* composer */
.composer{border-top:1px solid var(--line);padding:12px clamp(12px,2.5vw,22px) calc(12px + env(safe-area-inset-bottom))}
.composer-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.composer-box:focus-within{border-color:var(--faint)}
.composer textarea{width:100%;resize:none;background:none;border:0;outline:none;min-height:44px;max-height:200px;line-height:1.5}
.composer-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.composer-bar label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.composer-bar .grow{flex:1}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:8px 14px;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.ghost:hover{border-color:var(--faint)}
.btn.sm{padding:5px 10px;font-size:13px}
.hint{font-size:11px;color:var(--faint)}

/* thread pane */
.thread{border-left:1px solid var(--line);background:var(--panel);display:none;flex-direction:column;min-height:0}
.app.thread-open .thread{display:flex}
.thread-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.thread-head h3{margin:0;font-size:20px}
.thread .msg{padding:8px 16px}
.thread .msg:hover{background:var(--panel2)}
.thread .composer{padding:10px 12px}

/* inbox rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 22px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:hover{background:var(--panel)}
.row .who{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .snip{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .snip b{color:var(--text);font-weight:600}
.row time{font-size:12px;color:var(--faint);white-space:nowrap}
.row.unread .who,.row.unread time{color:var(--text)}
.row.unread .who::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle}

/* cards and forms */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h3{margin:0 0 4px;font-size:22px}
.card p.sub{margin:0 0 12px;color:var(--muted);font-size:13px}
.field{display:grid;gap:5px;margin-bottom:12px}
.field span{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;width:100%}
.field textarea{min-height:120px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--faint)}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* intake */
.intake-item{display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.intake-item:first-child{border-top:0}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:132px;height:132px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.board i{display:block;background:var(--panel2)}
.intake-item h4{margin:0;font-size:15px;overflow-wrap:anywhere}
.intake-item .from{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.intake-item .bodyprev{margin:8px 0;color:var(--muted);font-size:13px;white-space:pre-wrap;max-height:84px;overflow:hidden;overflow-wrap:anywhere}
.sig{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.receipts{font:12px/1.6 "JetBrains Mono",monospace;color:var(--muted);max-height:300px;overflow:auto}
.receipts div{padding:6px 0;border-top:1px dashed var(--line);overflow-wrap:anywhere}
.receipts div:first-child{border-top:0}

/* engagement */
.steps{display:grid;gap:0;counter-reset:s}
.step{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);font:700 13px/1 "JetBrains Mono",monospace}
.step.done .n{background:var(--ok);border-color:var(--ok);color:#0b120b}
.step.next .n{border-color:var(--accent);color:var(--accent)}
.step h4{margin:3px 0 2px;font-size:15px}
.step .meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.step .hash{font:11px "JetBrains Mono",monospace;color:var(--faint);overflow-wrap:anywhere}
.proof{margin-top:12px;font-size:13px}

/* verify */
.verdict{margin-top:12px;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:14px}
.verdict.ok{border-color:var(--ok)}.verdict.bad{border-color:var(--accent)}.verdict.warn{border-color:var(--warn)}

.floor-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.pill{font:700 11px/1 "JetBrains Mono",monospace;letter-spacing:.6px;text-transform:uppercase;border-radius:999px;padding:6px 10px;border:1px solid var(--line);color:var(--muted)}
.pill.open{color:var(--ok);border-color:var(--ok)}
.pill.draft{color:var(--warn);border-color:var(--warn)}
.seat{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.seat:first-of-type{border-top:0}
.seat .avatar{width:30px;height:30px;font-size:11px}
.seat .who{min-width:0}
.seat .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .who small{color:var(--faint);font-size:12px}
.seat select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:13px}
.seat label{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--muted);white-space:nowrap}
.seat-add{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.seat-add select{flex:1;min-width:140px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.accept-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.accept-row:first-of-type{border-top:0}
.accept-row .grow{flex:1;min-width:180px}
.gate{margin:16px 22px 0;padding:14px 16px;border:1px solid var(--warn);border-radius:10px;background:var(--panel);font-size:14px;color:var(--muted)}
.gate b{color:var(--text)}
@media (max-width:820px){.seat{grid-template-columns:30px minmax(0,1fr) auto;}.seat label,.seat .rm{grid-column:2 / -1;justify-self:start}.gate{margin:12px 16px 0}}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;padding:10vh 16px 16px;z-index:50}
.scrim.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(480px,100%);padding:18px;max-height:80vh;overflow:auto}
.modal h3{margin:0 0 12px;font-size:24px}
.switch-list{display:grid;gap:2px;margin-top:8px;max-height:46vh;overflow:auto}
.switch-list button{display:flex;gap:10px;align-items:center;background:none;border:0;border-radius:8px;padding:8px 10px;text-align:left}
.switch-list button.sel,.switch-list button:hover{background:var(--hover)}
.switch-list small{color:var(--faint);margin-left:auto}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100vw - 32px);font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1100px){.app.thread-open{grid-template-columns:268px minmax(0,1fr)}.app.thread-open .thread{position:fixed;inset:0 0 0 auto;width:min(380px,100vw);z-index:40;box-shadow:var(--shadow)}}
@media (max-width:820px){
  .app,.app.thread-open{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:45;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}
  .app.nav-open .side{transform:none}
  .menu-btn{display:inline-block}
  .search{width:auto;flex:0 1 160px}
  .search kbd{display:none}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:minmax(0,1fr) auto;padding:11px 16px}
  .row .snip{grid-column:1 / -1;grid-row:2}
  .msg{padding:8px 16px}
  .day{padding:16px 16px 6px}
  .intake-item{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Workspace navigation">
    <div class="brand">
      <div>
        <h1 class="display">Switch<span>board</span></h1>
        <small>Gas-Lighting LLC · client desk</small>
      </div>
      <button class="chip-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
    </div>
    <nav class="side-scroll" id="nav"></nav>
    <div class="side-foot">
      <div class="persona">
        <div class="avatar" id="meAvatar"></div>
        <select id="persona" aria-label="Acting as"></select>
      </div>
      <div class="foot-row">
        <button class="chip-btn" id="addMemberBtn">+ Member</button>
        <button class="chip-btn" id="relayBtn">Relay</button>
        <button class="chip-btn" id="exportBtn">Export</button>
        <button class="chip-btn" id="importBtn">Import</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
      <div class="sync-line"><span class="dot" id="syncDot"></span><span id="syncText">Stored in this browser</span></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Open navigation">☰</button>
      <div class="title"><h2 class="display" id="viewTitle">Inbox</h2><p id="viewSub"></p></div>
      <label class="search"><input id="search" type="search" placeholder="Search messages" aria-label="Search messages"><kbd>Ctrl K</kbd></label>
    </header>
    <section class="content" id="content" aria-live="polite"></section>
    <footer class="composer" id="composer" hidden>
      <div class="composer-box">
        <textarea id="input" rows="2" placeholder="Message"></textarea>
        <div class="composer-bar">
          <label title="Embed an invisible zero-width integrity mark"><input type="checkbox" id="markToggle" checked> Watermark</label>
          <span class="hint" id="composerHint">Enter to send · Shift+Enter for a new line</span>
          <span class="grow"></span>
          <button class="btn" id="sendBtn">Send</button>
        </div>
      </div>

</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
"use strict";

/* ---------- storage ---------- */
const KEY = "switchboard.v1";
const PREF = "switchboard.prefs";
// Each member record is one membership: one person, one organization, one role.
// The same real person in two organizations is two separate records and is never merged.
const ROLES = [["client","Client"],["coworker","Coworker"],["team","Team"],["contractor","Contractor"]];
const roleLabel = (r) => { const f = ROLES.find((x) => x[0] === r); return f ? f[1] : ""; };
const COLORS = ["#f34b42","#7fb0d8","#6fbf73","#e0a84a","#b58ad8","#4fb6a8","#d87f9c","#9aa84f"];

function seed() {
  const now = Date.now();
  return {
    v: 1,
    rev: 0,
    me: "u-host",
    users: {
      "u-host": { name: "Mr. Musha", org: "o-gsl", role: "team" },
      "u-band": { name: "Band contact", org: "o-ind", role: "client" }
    },
    orgs: [
      { id: "o-gsl", name: "Gas-Lighting LLC", domain: "gas-lighting.com", host: true },
      { id: "o-ind", name: "Indiscipline", domain: "indisciplinetributeband.us.com" }
    ],
    channels: [
      { id: "c-desk", orgId: "o-gsl", name: "desk", topic: "Internal notes for the GSL side only", internal: true },
      { id: "c-site", orgId: "o-ind", name: "website-rebuild", topic: "Bandzoogle replacement and the Sanity dashboard" },
      { id: "c-show", orgId: "o-ind", name: "oct-16-reggies", topic: "October 16 show at Reggie's Rock Club: poster, QR, tickets" }
    ],
    messages: [
      { id: "m-welcome", channelId: "c-site", author: "u-host", ts: now, body: "This channel is where the rebuild runs. Concepts and the editor preview live at gas-lighting.com/indiscipline-concepts." }
    ],
    intake: [],
    receipts: [],
    engagements: {},
    floors: {},
    read: {}
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && s.v === 1) { if (!s.floors) s.floors = {}; return s; }
    }
  } catch (e) { /* storage blocked or corrupt: fall through to seed */ }
  return seed();
}
function loadPrefs() {
  try { return JSON.parse(localStorage.getItem(PREF) || "{}") || {}; } catch (e) { return {}; }
}

let S = loadState();
let P = loadPrefs();
let storageOk = true;

function save(opts) {
  S.rev = (S.rev || 0) + 1;
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; }
  catch (e) { storageOk = false; }
  setSync();
  if (!(opts && opts.noPush)) schedulePush();
}
function savePrefs() { try { localStorage.setItem(PREF, JSON.stringify(P)); } catch (e) { /* per-viewer convenience only */ } }

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const uid = (p) => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const org = (id) => S.orgs.find((o) => o.id === id);
const chan = (id) => S.channels.find((c) => c.id === id);
const user = (id) => S.users[id] || { name: String(id || "Unknown"), org: null };
const isHost = (uidv) => { const u = user(uidv); const o = u.org && org(u.org); return !!(o && o.host); };
function initials(name) { return String(name).split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("") || "?"; }
function colorFor(key) { let h = 0; for (const ch of String(key)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
function avatarHTML(id, label) { const u = user(id); const n = label || u.name; return `<div class="avatar" style="background:${colorFor(id)}">${esc(initials(n))}</div>`; }
function fmtTime(ts) { return new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
function fmtShort(ts) {
  const d = new Date(ts), n = new Date();
  if (d.toDateString() === n.toDateString()) return fmtTime(ts);
  return d.toLocaleDateString([], { month: "short", day: "numeric" });
}
function fmtDay(ts) { return new Date(ts).toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: "numeric" }); }
function fmtFull(ts) { return new Date(ts).toLocaleString([], { year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", second: "2-digit" }); }

let toastTimer = 0;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

function download(name, text) {
  const blob = new Blob([text], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- hashing and crypto ---------- */
const enc = new TextEncoder(), dec = new TextDecoder();
async function sha256(text) {
  const b = await crypto.subtle.digest("SHA-256", enc.encode(text));
  return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
}
function b64e(u8) { let s = ""; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
function b64d(s) { return Uint8Array.from(atob(s), (c) => c.charCodeAt(0)); }
async function deriveKey(pass, saltB64) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64d(saltB64), iterations: 310000, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
  );
}
async function seal(key, text) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(text)));
  return { iv: b64e(iv), ct: b64e(ct) };
}
async function unseal(key, box) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(box.iv) }, key, b64d(box.ct));
  return dec.decode(pt);
}
const keys = {};      // channelId -> CryptoKey, memory only
const plain = {};     // messageId -> decrypted text, memory only

/* ---------- zero-width integrity mark ---------- */
const ZW0 = "​", ZW1 = "‌", ZWS = "⁠", ZWE = "⁣";
const ZWRE = /[​‌⁠⁣]/g;
const visible = (t) => String(t).replace(ZWRE, "");
async function stamp(text, author) {
  const vis = visible(text);
  const payload = JSON.stringify({ v: 1, a: author, t: Date.now(), h: (await sha256(vis)).slice(0, 16) });
  let bits = "";
  for (const b of enc.encode(payload)) bits += b.toString(2).padStart(8, "0");
  let carrier = "";
  for (const c of bits) carrier += c === "0" ? ZW0 : ZW1;
  return vis + ZWS + carrier + ZWE;
}
function extractMark(text) {
  const s = text.indexOf(ZWS);
  if (s < 0) return null;
  const e = text.indexOf(ZWE, s + 1);
  if (e < 0) return { broken: true };
  let bits = "";
  for (const c of text.slice(s + 1, e)) { if (c === ZW0) bits += "0"; else if (c === ZW1) bits += "1"; }
  if (!bits.length || bits.length % 8) return { broken: true };
  const bytes = new Uint8Array(bits.length / 8);
  for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(bits.slice(i * 8, i * 8 + 8), 2);
  try { const m = JSON.parse(dec.decode(bytes)); return m && m.h ? m : { broken: true }; }
  catch (err) { return { broken: true }; }
}
async function verifyMark(text) {
  const m = extractMark(text);
  if (!m) return { status: "none" };
  if (m.broken) return { status: "disturbed" };
  const h = (await sha256(visible(text))).slice(0, 16);
  return { status: h === m.h ? "intact" : "altered", mark: m };
}
function markLabel(r) {
  if (r.status === "intact") return `Mark intact. Written by ${user(r.mark.a).name} at ${fmtFull(r.mark.t)}; the visible text matches what was signed.`;
  if (r.status === "altered") return `Mark found but the visible text no longer matches. Written by ${user(r.mark.a).name} at ${fmtFull(r.mark.t)}; this copy has been edited.`;
  if (r.status === "disturbed") return "A mark is present but its invisible characters were damaged, so authorship cannot be read. Treat the copy as tampered.";
  return "No mark found. Either it was never marked or the invisible characters were stripped in transit.";
}

/* ---------- intake screening ---------- */
const URGENT = new Set(["urgent","urgently","immediately","asap","verify","verification","suspended","suspend","locked","expire","expires","expired","wire","gift","password","overdue","final","notice","act","click","limited","confirm","unusual","security","alert","reactivate","refund","prize","winner"]);
const MONEY = /(\$\s?\d|\busd\b|bitcoin|\bbtc\b|crypto|payment|bank|routing|invoice|zelle|venmo|cashapp|western union|gift card)/gi;
function fnv1a(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function tokens(text) { return String(text).toLowerCase().split(/[^a-z0-9@.\-']+/).filter((t) => t.length > 1); }
function domainOf(addr) { const m = String(addr).toLowerCase().match(/@([a-z0-9.\-]+)/); return m ? m[1].replace(/\.$/, "") : ""; }
function linkDomains(text) {
  const out = [];
  const re = /https?:\/\/([a-z0-9.\-]+)/gi;
  let m;
  while ((m = re.exec(text))) out.push(m[1].toLowerCase());
  return out;
}
function sameSite(a, b) { if (!a || !b) return false; return a === b || a.endsWith("." + b) || b.endsWith("." + a); }
function screen(from, subject, body) {
  const all = subject + "\n" + body;
  const toks = tokens(all);
  const board = new Array(64).fill(0);
  for (const t of toks) board[fnv1a(t) % 64]++;
  const known = S.orgs.map((o) => o.domain).filter(Boolean);
  const fd = domainOf(from);
  const links = linkDomains(all);
  const foreign = links.filter((d) => !sameSite(d, fd) && !known.some((k) => sameSite(d, k)));
  const urgent = toks.filter((t) => URGENT.has(t)).length;
  const money = (all.match(MONEY) || []).length;
  const knownSender = known.some((k) => sameSite(fd, k));
  const sig = { tokens: toks.length, links: links.length, foreign: foreign.length, urgent, money, knownSender, fromDomain: fd };
  let verdict;
  if (toks.length < 6 || !fd) verdict = "unknown";
  else {
    const score = urgent * 2 + money * 2 + foreign.length * 3 + (links.length > 3 ? 2 : 0) - (knownSender ? 2 : 0);
    sig.score = score;
    verdict = score >= 5 ? "hold" : score <= 1 ? "release" : "unknown";
  }
  return { board, sig, verdict };
}
function boardHTML(board) {
  const max = Math.max(1, ...board);
  return `<div class="board" aria-label="Token board">${board.map((v) => `<i style="background:${v ? `color-mix(in srgb, var(--accent) ${Math.round(18 + 82 * v / max)}%, var(--panel2))` : "var(--panel2)"}"></i>`).join("")}</div>`;
}

/* ---------- engagement flow ---------- */
const STEPS = [
  { key: "scope", name: "Scope written", who: "host" },
  { key: "proposal", name: "Proposal accepted", who: "client" },
  { key: "contract", name: "Contract signed", who: "client" },
  { key: "access", name: "Access granted", who: "client" },
  { key: "kickoff", name: "Kickoff held", who: "host" },
  { key: "delivered", name: "Delivered", who: "host" },
  { key: "accepted", name: "Accepted", who: "client" }
];
function engagement(orgId) {
  if (!S.engagements[orgId]) S.engagements[orgId] = { steps: STEPS.map(() => null) };
  return S.engagements[orgId];
}
function stepMaterial(prev, i, rec) { return [prev || "genesis", i, STEPS[i].key, rec.by, rec.ts, rec.note || ""].join("|"); }
async function proofRun(orgId) {
  const e = engagement(orgId);
  let prev = "";
  for (let i = 0; i < STEPS.length; i++) {
    const rec = e.steps[i];
    if (!rec) break;
    const h = await sha256(stepMaterial(prev, i, rec));
    if (h !== rec.hash) return { ok: false, at: i };
    prev = h;
  }
  return { ok: true, head: prev };
}

/* ---------- view state ---------- */
let view = P.view || "inbox";
let threadOf = null;
let query = "";

function unreadCount(cid) {
  const last = S.read[cid] || 0;
  return S.messages.filter((m) => m.channelId === cid && !m.replyTo && m.ts > last && m.author !== S.me).length;
}
function visibleChannels() {
  // Host members see every channel. A client member sees their own organization's
  // shared channels only once its Floor is open and they hold a seat on the accepted version.
  if (isHost(S.me)) return S.channels;
  const myOrg = user(S.me).org;
  if (!openSeat(myOrg, S.me)) return [];
  return S.channels.filter((c) => c.orgId === myOrg && !c.internal);
}
function canSee(cid) { return visibleChannels().some((c) => c.id === cid); }

/* ---------- navigation ---------- */
function renderNav() {
  const host = isHost(S.me);
  const pending = S.intake.filter((i) => i.status === "pending").length;
  const totalUnread = visibleChannels().reduce((n, c) => n + unreadCount(c.id), 0);
  let h = "";
  h += navItem("inbox", "◆", "Inbox", totalUnread ? `<span class="badge">${totalUnread}</span>` : "");
  if (host) h += navItem("intake", "▦", "Intake", pending ? `<span class="badge">${pending}</span>` : "");
  h += navItem("verify", "✓", "Verify a copy", "");
  const orgs = host ? S.orgs : S.orgs.filter((o) => o.id === user(S.me).org);
  h += `<div class="nav-label">Clients${host ? `<button id="addOrgBtn" title="Add client" aria-label="Add client">+</button>` : ""}</div>`;
  for (const o of orgs) {
    h += `<div class="org-head"><span class="org-dot" style="background:${colorFor(o.id)}"></span><span class="grow">${esc(o.name)}</span>${host ? `<button data-addchan="${o.id}" title="New channel">+ channel</button>` : ""}</div>`;
    if (!o.host) h += navItem("floor:" + o.id, "▣", "Floor", floorBadge(o.id));
    for (const c of visibleChannels().filter((c) => c.orgId === o.id)) {
      const u = unreadCount(c.id);
      const glyph = c.sealed ? (keys[c.id] ? "◇" : "◈") : (c.internal ? "·" : "#");
      h += `<button class="nav-item ${view === "ch:" + c.id ? "active" : ""} ${u ? "unread" : ""}" data-view="ch:${c.id}"><span class="glyph">${glyph}</span><span class="grow">${esc(c.name)}</span>${u ? `<span class="badge">${u}</span>` : ""}</button>`;
    }
    if (!o.host) h += navItem("eng:" + o.id, "⛓", "Engagement", engBadge(o.id));
  }
  $("nav").innerHTML = h;
  $("nav").querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => go(b.dataset.view)));
  $("nav").querySelectorAll("[data-addchan]").forEach((b) => b.addEventListener("click", () => newChannel(b.dataset.addchan)));
  const ao = $("addOrgBtn");
  if (ao) ao.addEventListener("click", newOrg);
}
function navItem(v, glyph, label, extra) {
  return `<button class="nav-item ${view === v ? "active" : ""}" data-view="${v}"><span class="glyph">${glyph}</span><span class="grow">${esc(label)}</span>${extra}</button>`;
}
function engBadge(orgId) {
  const e = engagement(orgId);
  const done = e.steps.filter(Boolean).length;
  return `<span class="badge soft">${done}/${STEPS.length}</span>`;
}

function renderPersona() {
  const sel = $("persona");
  sel.innerHTML = Object.entries(S.users).map(([id, u]) => `<option value="${id}" ${id === S.me ? "selected" : ""}>${esc(u.name)} · ${esc((org(u.org) || {}).name || "")}${u.role ? " · " + esc(roleLabel(u.role)) : ""}</option>`).join("");
  $("meAvatar").style.background = colorFor(S.me);
  $("meAvatar").textContent = initials(user(S.me).name);
}

function go(v) {
  if (v.startsWith("ch:") && !canSee(v.slice(3))) v = "inbox";
  if (v.startsWith("floor:") && !canViewFloor(v.slice(6))) v = "inbox";
  view = v;
  P.view = v; savePrefs();
  query = "";
  $("search").value = "";
  if (!v.startsWith("ch:")) closeThread();
  $("app").classList.remove("nav-open");
  render();
}

/* ---------- main render ---------- */
function render() {
  renderNav();
  renderPersona();
  const comp = $("composer");
  comp.hidden = true;
  if (query) return renderSearch();
  if (view.startsWith("ch:")) return renderChannel(view.slice(3));
  if (view === "intake" && isHost(S.me)) return renderIntake();
  if (view === "verify") return renderVerify();
  if (view.startsWith("eng:")) return renderEngagement(view.slice(4));
  if (view.startsWith("floor:")) return renderFloor(view.slice(6));
  return renderInbox();
}
function setTitle(t, sub) { $("viewTitle").textContent = t; $("viewSub").textContent = sub || ""; document.title = t + " · Switchboard"; }

function bodyOf(m) {
  if (!m.sealed) return m.body;
  return Object.prototype.hasOwnProperty.call(plain, m.id) ? plain[m.id] : null;
}
function snippet(m) {
  const b = bodyOf(m);
  if (b == null) return "Sealed message";
  return visible(b).replace(/\s+/g, " ").slice(0, 140);
}

function renderInbox() {
  setTitle("Inbox", isHost(S.me) ? "Every client channel, newest first" : "Your channels with Gas-Lighting LLC");
  const rows = visibleChannels().map((c) => {
    const ms = S.messages.filter((m) => m.channelId === c.id);
    const last = ms.reduce((a, m) => (!a || m.ts > a.ts ? m : a), null);
    return { c, last, unread: unreadCount(c.id) };
  }).sort((a, b) => ((b.last && b.last.ts) || 0) - ((a.last && a.last.ts) || 0));
  const pending = isHost(S.me) ? S.intake.filter((i) => i.status === "pending") : [];
  let h = `<div class="rows">`;
  for (const it of pending) {
    h += `<button class="row unread" data-go="intake"><span class="who">Intake · ${esc(it.from)}</span><span class="snip"><b>${esc(it.subject || "(no subject)")}</b> · waiting for a person · suggested ${esc(it.verdict)}</span><time>${fmtShort(it.ts)}</time></button>`;
  }
  for (const r of rows) {
    const o = org(r.c.orgId);
    const who = r.last ? user(r.last.author).name : "No messages yet";
    h += `<button class="row ${r.unread ? "unread" : ""}" data-go="ch:${r.c.id}"><span class="who">${esc(o ? o.name : "")} · ${esc(r.c.name)}</span><span class="snip">${r.last ? `<b>${esc(who)}</b> · ${esc(snippet(r.last))}` : esc(r.c.topic || "")}</span><time>${r.last ? fmtShort(r.last.ts) : ""}</time></button>`;
  }
  h += `</div>`;
  if (!rows.length && !pending.length) {
    const mo = user(S.me).org;
    h = !isHost(S.me) && mo && !openSeat(mo, S.me)
      ? `<div class="empty"><h3 class="display">The floor isn't open yet</h3><p>Your channels with Gas-Lighting LLC open once both teams agree the floor.</p><p><button class="btn" data-go="floor:${mo}">Go to the floor</button></p></div>`
      : `<div class="empty"><h3 class="display">Nothing here yet</h3><p>Channels you belong to will show up here.</p></div>`;
  }
  $("content").innerHTML = h;
  $("content").querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => go(b.dataset.go)));
}

function messageHTML(m, inThread) {
  const u = user(m.author);
  const o = u.org ? org(u.org) : null;
  const body = bodyOf(m);
  const replies = inThread ? 0 : S.messages.filter((x) => x.replyTo === m.id).length;
  const marked = body != null && body.indexOf(ZWS) >= 0;
  const label = m.authorLabel || u.name;
  return `<div class="msg" data-id="${m.id}">
    ${avatarHTML(m.author, label)}
    <div>
      <div class="msg-head"><b>${esc(label)}</b>${o ? `<span class="org">${esc(o.name)}${u.role && !m.authorLabel ? " · " + esc(roleLabel(u.role)) : ""}</span>` : ""}<time datetime="${new Date(m.ts).toISOString()}" title="${esc(fmtFull(m.ts))}">${fmtTime(m.ts)}</time></div>
      <div class="msg-body ${body == null ? "locked" : ""}">${body == null ? "Sealed. Unlock this channel to read." : esc(body)}</div>
      <div class="msg-meta">
        ${speaksFor(m)}
        ${m.sealed ? `<span class="tag info">sealed</span>` : ""}
        ${m.via ? `<span class="tag">${esc(m.via)}</span>` : ""}
        ${marked ? `<button class="tag ok" data-verify="${m.id}" title="Check the integrity mark">marked</button>` : ""}
        ${replies ? `<button class="link-btn" data-thread="${m.id}">${replies} ${replies === 1 ? "reply" : "replies"}</button>` : ""}
      </div>
    </div>
    <div class="msg-actions">
      ${inThread ? "" : `<button data-thread="${m.id}">Reply</button>`}
      ${body != null ? `<button data-copy="${m.id}">Copy</button>` : ""}
      ${m.author === S.me ? `<button data-del="${m.id}">Delete</button>` : ""}
    </div>
  </div>`;
}
function listHTML(msgs, inThread) {
  let h = "", lastDay = "";
  for (const m of msgs) {
    const d = new Date(m.ts).toDateString();
    if (d !== lastDay && !inThread) { h += `<div class="day">${esc(fmtDay(m.ts))}</div>`; lastDay = d; }
    h += messageHTML(m, inThread);
  }
  return h;
}
function wireMessages(root) {
  root.querySelectorAll("[data-thread]").forEach((b) => b.addEventListener("click", () => openThread(b.dataset.thread)));
  root.querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", async () => {
    const m = S.messages.find((x) => x.id === b.dataset.copy);
    const t = m && bodyOf(m);
    if (t == null) return;
    try { await navigator.clipboard.writeText(t); toast("Copied with its mark intact"); }
    catch (e) { toast("Clipboard blocked by the browser"); }
  }));
  root.querySelectorAll("[data-verify]").forEach((b) => b.addEventListener("click", async () => {
    const m = S.messages.find((x) => x.id === b.dataset.verify);
    const t = m && bodyOf(m);
    if (t == null) return;
    const r = await verifyMark(t);
    toast(r.status === "intact" ? "Mark intact, text unchanged" : r.status === "altered" ? "Text changed after marking" : "Mark damaged");
  }));
  root.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", () => {
    const id = b.dataset.del;
    S.messages = S.messages.filter((m) => m.id !== id && m.replyTo !== id);
    if (threadOf === id) closeThread();
    save(); render(); if (threadOf) renderThread();
  }));
}

function renderChannel(cid) {
  const c = chan(cid);
  if (!c) return go("inbox");
  const o = org(c.orgId);
  setTitle("#" + c.name, (o ? o.name + " · " : "") + (c.topic || "") + (c.sealed ? " · sealed, AES-GCM" : ""));
  const msgs = S.messages.filter((m) => m.channelId === cid && !m.replyTo).sort((a, b) => a.ts - b.ts);
  const locked = c.sealed && !keys[cid];
  let h = "";
  if (locked) {
    h += `<div class="pad"><div class="card"><h3 class="display">Sealed channel</h3><p class="sub">Messages here are encrypted in the browser before they are stored or relayed. The passphrase never leaves this device.</p>
      <div class="field"><span>Passphrase</span><input type="password" id="unlockPass" autocomplete="off"></div>
      <div class="actions"><button class="btn" id="unlockBtn">Unlock</button></div></div></div>`;
  }
  h += msgs.length ? `<div class="msgs">${listHTML(msgs)}</div>` : `<div class="empty"><h3 class="display">#${esc(c.name)}</h3><p>${esc(c.topic || "Start the conversation.")}</p></div>`;
  $("content").innerHTML = h;
  wireMessages($("content"));
  if (locked) {
    const go2 = () => unlock(cid, $("unlockPass").value);
    $("unlockBtn").addEventListener("click", go2);
    $("unlockPass").addEventListener("keydown", (e) => { if (e.key === "Enter") go2(); });
    $("unlockPass").focus();
  }
  const gate = postGate(c);
  if (gate) $("content").insertAdjacentHTML("afterbegin", `<div class="gate">${gate}</div>`);
  const fb = $("content").querySelector("[data-go-floor]");
  if (fb) fb.addEventListener("click", () => go("floor:" + c.orgId));
  const comp = $("composer");
  comp.hidden = locked || !!gate;
  $("input").placeholder = "Message #" + c.name;
  $("composerHint").textContent = c.sealed ? "Encrypted before it is stored · Enter to send" : "Enter to send · Shift+Enter for a new line";
  const last = msgs.length ? msgs[msgs.length - 1].ts : 0;
  if ((S.read[cid] || 0) < last) { S.read[cid] = last; save({ noPush: true }); renderNav(); }
  const sc = $("content"); sc.scrollTop = sc.scrollHeight;
}

async function unlock(cid, pass) {
  const c = chan(cid);
  if (!c || !pass) return;
  try {
    const k = await deriveKey(pass, c.salt);
    const check = await unseal(k, c.check);
    if (check !== "switchboard") throw new Error("check");
    keys[cid] = k;
    for (const m of S.messages.filter((x) => x.channelId === cid && x.sealed)) {
      try { plain[m.id] = await unseal(k, m.sealed); } catch (e) { plain[m.id] = "[could not decrypt]"; }
    }
    toast("Unlocked for this session");
    render();
  } catch (e) { toast("Wrong passphrase"); }
}

async function send(text, cid, replyTo) {
  const c = chan(cid);
  if (!c || !text.trim()) return;
  if (postGate(c)) { toast("Posting here needs a seat on the open floor"); return; }
  let body = text.replace(/\s+$/, "");
  if ($("markToggle").checked) body = await stamp(body, S.me);
  const m = { id: uid("m"), channelId: cid, author: S.me, ts: Date.now(), body };
  if (replyTo) m.replyTo = replyTo;
  if (c.sealed) {
    if (!keys[cid]) { toast("Unlock the channel first"); return; }
    m.sealed = await seal(keys[cid], body);
    plain[m.id] = body;
    m.body = "";
  }
  S.messages.push(m);
  if (!replyTo) S.read[cid] = m.ts;
  save();
  render();
  if (threadOf) renderThread();
}

/* ---------- threads ---------- */
function openThread(mid) {
  threadOf = mid;
  $("app").classList.add("thread-open");
  renderThread();
  $("threadInput").focus();
}
function closeThread() { threadOf = null; $("app").classList.remove("thread-open"); }
function renderThread() {
  const root = S.messages.find((m) => m.id === threadOf);
  if (!root) return closeThread();
  const reps = S.messages.filter((m) => m.replyTo === threadOf).sort((a, b) => a.ts - b.ts);
  $("threadBody").innerHTML = `<div class="msgs">${messageHTML(root, true)}<div class="day">${reps.length} ${reps.length === 1 ? "reply" : "replies"}</div>${listHTML(reps, true)}</div>`;
  wireMessages($("threadBody"));
}

/* ---------- search ---------- */
function renderSearch() {
  const q = query.toLowerCase();
  setTitle("Search", `Results for “${query}”`);
  const visibleIds = new Set(visibleChannels().map((c) => c.id));
  const hits = S.messages.filter((m) => visibleIds.has(m.channelId)).filter((m) => {
    const b = bodyOf(m);
    return b != null && visible(b).toLowerCase().includes(q);
  }).sort((a, b) => b.ts - a.ts);
  let h = `<div class="rows">`;
  for (const m of hits) {
    const c = chan(m.channelId), o = org(c.orgId);

  if (!hits.length) h = `<div class="empty"><h3 class="display">No matches</h3><p>Sealed channels are searched only while unlocked.</p></div>`;

    go(b.dataset.go);

}

        ${it.status === "pending" || it.status === "held" ? `<div class="actions">

          <button class="btn sm" data-release="${it.id}">Release</button>

          <button class="btn ghost sm" data-discard="${it.id}">Discard</button>
        </div>` : ""}
      </div>

  }
  const receipts = S.receipts.slice().reverse().map((r) => `<div>${esc(fmtFull(r.ts))} · ${esc(r.decision)} by ${esc(user(r.by).name)} · suggested ${esc(r.verdict)}<br>board ${esc(r.board.slice(0, 16))} · chain ${esc(r.chain.slice(0, 16))}</div>`).join("");
  $("content").innerHTML = `<div class="pad"><div class="grid2">

      <h3 class="display">Screen a message</h3>

      <div class="field"><span>From</span><input id="inFrom" placeholder="name@company.com" autocomplete="off"></div>
      <div class="field"><span>Subject</span><input id="inSubj" autocomplete="off"></div>
      <div class="field"><span>Body</span><textarea id="inBody"></textarea></div>
      <div class="actions"><button class="btn" id="screenBtn">Screen</button></div>
    </div>
    <div class="card">
      <h3 class="display">Decision receipts</h3>
      <p class="sub">Each decision is hashed with the one before it. Any edit to past receipts breaks the chain.</p>
      <div class="actions" style="margin-bottom:10px"><button class="btn ghost sm" id="chainBtn">Check chain</button><button class="btn ghost sm" id="receiptExport">Export receipts</button></div>
      <div class="receipts">${receipts || "No decisions yet."}</div>
    </div>
  </div>
  <div class="card" style="margin-top:18px"><h3 class="display">Queue</h3>${list || `<p class="sub">Nothing screened yet.</p>`}</div></div>`;

  $("screenBtn").addEventListener("click", () => {
    const from = $("inFrom").value.trim(), subject = $("inSubj").value.trim(), body = $("inBody").value;
    if (!from && !body.trim()) { toast("Paste a sender or a body first"); return; }
    const r = screen(from, subject, body);
    S.intake.push({ id: uid("i"), from: from || "(no sender)", subject, body, ts: Date.now(), board: r.board, sig: r.sig, verdict: r.verdict, status: "pending" });
    save(); render();
  });
  const decide = async (id, decision) => {
    const it = S.intake.find((x) => x.id === id);
    if (!it) return;
    if (decision === "released") {
      const sel = $("content").querySelector(`[data-route="${id}"]`);

    const rec = { ts: Date.now(), item: it.id, decision, verdict: it.verdict, by: S.me, board };
    rec.chain = await sha256(prev + "|" + [rec.ts, rec.item, rec.decision, rec.verdict, rec.by, rec.board].join("|"));

  };
  $("content").querySelectorAll("[data-release]").forEach((b) => b.addEventListener("click", () => decide(b.dataset.release, "released")));

  $("chainBtn").addEventListener("click", async () => {
    let prev = "genesis";
    for (let i = 0; i < S.receipts.length; i++) {
      const r = S.receipts[i];
      const h = await sha256(prev + "|" + [r.ts, r.item, r.decision, r.verdict, r.by, r.board].join("|"));
      if (h !== r.chain) { toast(`Chain breaks at receipt ${i + 1}`); return; }
      prev = h;
    }
    toast(S.receipts.length ? `Chain clean across ${S.receipts.length} receipts` : "No receipts yet");
  });
  $("receiptExport").addEventListener("click", () => download("switchboard-receipts.json", JSON.stringify(S.receipts, null, 2)));
}

  });

}
async function signStep(orgId, i) {
  const note = await ask("Sign: " + STEPS[i].name, [{ id: "note", label: "Note (optional)", placeholder: "Reference, link or remark" }], "Sign");
  if (!note) return;
  const e = engagement(orgId);
  if (!canSign(orgId, STEPS[i].who)) { toast("Needs a signing seat on the open floor"); return; }
  if (e.steps[i] || (i > 0 && !e.steps[i - 1])) { toast("Out of order"); return; }
  let prev = "";
  for (let k = 0; k < i; k++) prev = e.steps[k].hash;
  const rec = { by: S.me, ts: Date.now(), note: note.note.trim() };
  rec.hash = await sha256(stepMaterial(prev, i, rec));
  e.steps[i] = rec;
  save(); render();
}

/* ---------- floor: the agreed meeting ground between GSL's team and a client's team ---------- */
const FLOOR_ROLES = [["lead", "Lead"], ["member", "Member"], ["observer", "Observer"]];
const DECISIONS = [["leads", "Leads decide for their side"], ["both-leads", "Both leads must agree"], ["any", "Any seated member may decide"]];
function hostOrg() { return S.orgs.find((o) => o.host); }
function benchOrgId(orgId, bench) { return bench === "host" ? (hostOrg() || {}).id : orgId; }
function benchName(orgId, bench) { const o = org(benchOrgId(orgId, bench)); return o ? o.name : bench; }
function floor(orgId) {
  if (!S.floors[orgId]) {
    let tz = "America/Chicago";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch (e) { /* keep default */ }
    S.floors[orgId] = {
      version: 1,
      seats: [],
      terms: { response: 24, hours: "Weekdays 10:00 to 18:00", tz, escalation: "Lead to lead in writing; a call within one business day if it stays unresolved", scope: "", decision: "leads" },
      accepts: { host: null, client: null },
      open: null,
      chain: []
    };
  }
  return S.floors[orgId];
}
function floorOpen(orgId) { const f = S.floors[orgId]; return !!(f && f.open); }
function openSeat(orgId, uidv) {
  const f = S.floors[orgId];
  return f && f.open ? f.open.seats.find((s) => s.uid === uidv) || null : null;
}
function canViewFloor(orgId) {
  const o = org(orgId);
  if (!o || o.host) return false;
  return isHost(S.me) || user(S.me).org === orgId;
}
function canSign(orgId, side) {
  const s = openSeat(orgId, S.me);
  return !!(s && s.bench === side && s.sign && s.role !== "observer");
}
function postGate(c) {
  const o = org(c.orgId);
  if (!o || o.host) return "";
  const f = S.floors[c.orgId];
  if (!f || !f.open) return `<b>The floor with ${esc(o.name)} isn't open.</b> Both teams seat their people and accept the same terms before anyone posts here. <button class="link-btn" data-go-floor>Go to the floor</button>`;
  const s = openSeat(c.orgId, S.me);
  if (!s) return `<b>You don't hold a seat on this floor.</b> You can read; posting needs a seat on the accepted version. <button class="link-btn" data-go-floor>Go to the floor</button>`;
  if (s.role === "observer") return `<b>You're seated as an observer.</b> Observers read; leads and members post.`;
  return "";
}
function speaksFor(m) {
  const c = chan(m.channelId);
  if (!c || m.authorLabel) return "";
  const s = openSeat(c.orgId, m.author);
  return s && s.role === "lead" ? `<span class="tag info">speaks for ${esc(benchName(c.orgId, s.bench))}</span>` : "";
}
function floorBadge(orgId) {
  const f = S.floors[orgId];
  if (!f || !f.open) return `<span class="badge soft">draft</span>`;
  return `<span class="badge soft">${f.version > f.open.version ? "amending" : "open"}</span>`;
}
function stable(v) {
  if (Array.isArray(v)) return "[" + v.map(stable).join(",") + "]";
  if (v && typeof v === "object") return "{" + Object.keys(v).sort().map((k) => JSON.stringify(k) + ":" + stable(v[k])).join(",") + "}";
  return JSON.stringify(v === undefined ? null : v);
}
function floorDoc(orgId, f, seats, terms, version) {
  return stable({
    client: orgId,
    host: (hostOrg() || {}).id,
    version,
    seats: seats.slice().sort((a, b) => (a.bench + a.uid).localeCompare(b.bench + b.uid)).map((s) => ({ uid: s.uid, name: user(s.uid).name, bench: s.bench, role: s.role, sign: !!s.sign })),
    terms
  });
}
function floorEdited(f) {
  // Any change after an acceptance or an open starts a new version; earlier acceptances no longer count.
  if (f.accepts.host || f.accepts.client || (f.open && f.open.version === f.version)) f.version++;
  f.accepts = { host: null, client: null };
}
async function floorChain(f, rec) {
  const prev = f.chain.length ? f.chain[f.chain.length - 1].hash : "genesis";
  rec.hash = await sha256(prev + "|" + [rec.kind, rec.bench || "", rec.by || "", rec.ts, rec.version, rec.terms].join("|"));
  f.chain.push(rec);
  return rec;
}
async function acceptFloor(orgId, bench) {
  const f = floor(orgId);
  const seat = f.seats.find((s) => s.uid === S.me && s.bench === bench);
  if (!seat || seat.role !== "lead") { toast("Only a lead seated on that side can accept"); return; }
  const leads = ["host", "client"].map((b) => f.seats.some((s) => s.bench === b && s.role === "lead"));
  if (!leads[0] || !leads[1]) { toast("Each side needs a lead before the floor can open"); return; }
  const th = await sha256(floorDoc(orgId, f, f.seats, f.terms, f.version));
  const rec = await floorChain(f, { kind: "accept", bench, by: S.me, ts: Date.now(), version: f.version, terms: th });
  f.accepts[bench] = rec;
  const other = f.accepts[bench === "host" ? "client" : "host"];
  if (other && other.terms === th && other.version === f.version) {
    f.open = { version: f.version, terms: th, ts: Date.now(), seats: JSON.parse(JSON.stringify(f.seats)), agreed: JSON.parse(JSON.stringify(f.terms)) };
    await floorChain(f, { kind: "open", ts: f.open.ts, version: f.version, terms: th });
    toast(`Floor open on version ${f.version}`);
  } else toast("Accepted. Waiting on the other side's lead.");
  save(); render();
}
async function proveFloor(orgId) {
  const f = floor(orgId);

    const h = await sha256(prev + "|" + [r.kind, r.bench || "", r.by || "", r.ts, r.version, r.terms].join("|"));
    if (h !== r.hash) return `Record ${i + 1} does not reproduce; the floor record was edited after the fact.`;
    prev = h;
  }
  if (f.open) {
    const h = await sha256(floorDoc(orgId, f, f.open.seats, f.open.agreed, f.open.version));

  return "";
}

/* ---------- relay sync (tailnet node) ---------- */
let pushTimer = 0, pulling = false, remoteTag = P.remoteTag || "";
function setSync(state, text) {
  const dot = $("syncDot"), t = $("syncText");
  if (!P.relay) {
    dot.className = "dot" + (storageOk ? "" : " err");
    t.textContent = storageOk ? "Stored in this browser" : "Browser storage blocked; changes last until reload";
    return;
  }
  dot.className = "dot " + (state || "ok");
  t.textContent = text || ("Relay · " + P.relay.replace(/^https?:\/\//, ""));
}
function relayHeaders(extra) {
  const h = Object.assign({}, extra || {});
  if (P.relayToken) h["Authorization"] = "Bearer " + P.relayToken;
  return h;
}
function schedulePush() {
  if (!P.relay) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 600);
}
function shareable() {
  // Sealed bodies already hold only ciphertext; per-viewer read markers stay local.
  const copy = JSON.parse(JSON.stringify(S));
  delete copy.read;
  delete copy.me;
  return copy;
}
async function push() {
  if (!P.relay) return;
  try {
    const res = await fetch(P.relay.replace(/\/$/, "") + "/state", {
      method: "PUT",
      headers: relayHeaders({ "Content-Type": "application/json", "If-Match": remoteTag || "*" }),
      body: JSON.stringify(shareable())
    });
    if (res.status === 412) { await pull(true); return; }
    if (!res.ok) throw new Error("HTTP " + res.status);
    remoteTag = res.headers.get("ETag") || remoteTag;
    P.remoteTag = remoteTag; savePrefs();
    setSync("ok");
  } catch (e) { setSync("err", "Relay unreachable · saved locally"); }
}
async function pull(merge) {
  if (!P.relay || pulling) return;
  pulling = true;
  try {
    const res = await fetch(P.relay.replace(/\/$/, "") + "/state", { headers: relayHeaders(remoteTag ? { "If-None-Match": remoteTag } : {}) });
    if (res.status === 304) { setSync("ok"); return; }
    if (res.status === 404) { await push(); return; }
    if (!res.ok) throw new Error("HTTP " + res.status);
    const remote = await res.json();
    remoteTag = res.headers.get("ETag") || "";
    P.remoteTag = remoteTag; savePrefs();
    if (remote && remote.v === 1) {
      const keepRead = S.read, keepMe = S.me;
      S = mergeState(remote, merge ? S : null);
      S.read = keepRead || {};
      S.me = S.users[keepMe] ? keepMe : Object.keys(S.users)[0];
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { storageOk = false; }
      render(); if (threadOf) renderThread();
      if (merge) await push();
    }
    setSync("ok");
  } catch (e) { setSync("err", "Relay unreachable · saved locally"); }
  finally { pulling = false; }
}
function mergeState(remote, local) {
  if (!local) return remote;
  const byId = (a, b) => { const m = new Map(); for (const x of a) m.set(x.id, x); for (const x of b) if (!m.has(x.id)) m.set(x.id, x); return [...m.values()]; };
  const out = remote;
  out.orgs = byId(remote.orgs || [], local.orgs || []);
  out.channels = byId(remote.channels || [], local.channels || []);
  out.messages = byId(remote.messages || [], local.messages || []);
  out.intake = byId(remote.intake || [], local.intake || []);
  out.users = Object.assign({}, local.users || {}, remote.users || {});
  const rr = remote.receipts || [], lr = local.receipts || [];
  out.receipts = rr.length >= lr.length ? rr : lr;
  out.engagements = Object.assign({}, local.engagements || {}, remote.engagements || {});
  out.floors = Object.assign({}, local.floors || {}, remote.floors || {});
  return out;
}
async function configureRelay() {
  const r = await ask("Relay", [
    { id: "url", label: "Relay URL (tailnet HTTPS, leave empty to keep data in this browser only)", placeholder: "https://gsl.your-tailnet.ts.net", value: P.relay || "" },
    { id: "token", label: "Relay token", type: "password", value: P.relayToken || "" }
  ], "Save");
  if (!r) return;
  P.relay = r.url.trim().replace(/\/$/, "");
  P.relayToken = r.token.trim();
  remoteTag = ""; P.remoteTag = "";
  savePrefs();
  if (P.relay) { setSync("warn", "Connecting…"); await pull(true); }
  else setSync();
}

function bindComposer(area, onSend) {
  const grow = () => { area.style.height = "auto"; area.style.height = Math.min(area.scrollHeight, 200) + "px"; };
  area.addEventListener("input", grow);
  area.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); onSend(); }
  });
  return grow;
}

});
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); quickSwitch(); }
  else if (e.key === "Escape") {
    if ($("scrim").classList.contains("open")) closeModal(null);
    else if (threadOf) closeThread();
    else $("app").classList.remove("nav-open");
  }
});
window.addEventListener("storage", (e) => { if (e.key === KEY && e.newValue) { try { S = JSON.parse(e.newValue); render(); } catch (err) { /* ignore partial writes */ } } });
window.addEventListener("focus", () => pull(true));
setInterval(() => { if (P.relay && document.visibilityState === "visible") pull(true); }, 15000);

if (P.theme) document.documentElement.setAttribute("data-theme", P.theme);
if (!S.users[S.me]) S.me = Object.keys(S.users)[0];
setSync();
go(view);
if (P.relay) pull(true);
})();
</script>
</body>
</html>
